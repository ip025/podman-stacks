---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  labels:
    app.kubernetes.io/name: teamspeak
    app.kubernetes.io/instance: teamspeak
    app.kubernetes.io/component: metrics
    app.kubernetes.io/part-of: teamspeak
    release: monitoring
  name: teamspeak
  namespace: teamspeak
spec:
  namespaceSelector:
    matchNames:
      - teamspeak
  selector:
    matchLabels:
      app.kubernetes.io/name: teamspeak
      app.kubernetes.io/instance: teamspeak
      app.kubernetes.io/component: metrics
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
