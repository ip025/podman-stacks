---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: teamspeak
    app.kubernetes.io/instance: teamspeak
    app.kubernetes.io/component: server
    app.kubernetes.io/part-of: teamspeak
  name: teamspeak
  namespace: teamspeak
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: teamspeak
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: teamspeak
        app.kubernetes.io/instance: teamspeak
        app.kubernetes.io/component: server
        app.kubernetes.io/part-of: teamspeak
        io.kompose.service: teamspeak
    spec:
      nodeName: whisperforge
      containers:
        - env:
            # reference: https://github.com/teamspeak/teamspeak6-server/blob/main/CONFIG.md
            - name: TSSERVER_LICENSE_ACCEPTED
              value: accept
            - name: TSSERVER_METRICS_ENABLED
              value: "true"
            - name: TSSERVER_METRICS_IP
              value: "0.0.0.0"
            - name: TSSERVER_METRICS_VOICE
              value: "true"
            - name: TSSERVER_QUERY_SSH_ALLOW_GUEST
              value: "0"
          image: teamspeaksystems/teamspeak6-server:6.0.0-beta13.1
          name: teamspeak-server
          ports:
            - containerPort: 9987
              protocol: UDP
            - containerPort: 30033
              protocol: TCP
            - containerPort: 10080
              protocol: TCP
            - containerPort: 9187
              name: metrics
              protocol: TCP
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 512Mi
              cpu: 1000m
          volumeMounts:
            - mountPath: /var/tsserver
              name: teamspeak-data
      restartPolicy: Always
      volumes:
        - name: teamspeak-data
          hostPath:
            path: /opt/teamspeak6
            type: DirectoryOrCreate
